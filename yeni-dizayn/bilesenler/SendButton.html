<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><meta charset="utf-8"><title>SendButton</title>
<style>html,body{margin:0;background:var(--bg-canvas)} .vc-root{padding:16px}</style></head>
<body style="font-family:var(--font-sans)"><div style="position:sticky;top:0;z-index:9;display:flex;gap:6px;align-items:center;padding:10px 16px;background:var(--material-bar);backdrop-filter:var(--material-blur);border-bottom:1px solid var(--separator);font:500 13px/18px var(--font-sans);color:var(--label)">
<a href="index.html" style="color:var(--accent-text);margin-right:auto;text-decoration:none">← Tüm bileşenler</a>
<div class="vc-seg" role="tablist"><button role="tab" data-t="light" onclick="setT('light')">Açık</button><button role="tab" data-t="dark" onclick="setT('dark')">Koyu</button><button role="tab" data-t="cream" onclick="setT('cream')">Krem</button><button role="tab" data-t="sand" onclick="setT('sand')">Kum</button><button role="tab" data-t="forest" onclick="setT('forest')">Orman</button></div></div>
<script>function setT(t){document.documentElement.dataset.theme=t;document.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));try{localStorage.setItem('vc-theme',t)}catch(e){}}
try{setT(localStorage.getItem('vc-theme')||'light')}catch(e){setT('light')}</script><div class="vc-root">
<div class="vc-row">
<button class="vc-send" aria-label="Gönder"><span class="vc-icon " style="--icon:url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20height%3D%2224px%22%20viewBox%3D%220%20-960%20960%20960%22%20width%3D%2224px%22%20fill%3D%22%23000%22%3E%3Cpath%20d%3D%22M446-168v-495.15L216.31-433.46%20168-481l311-311%20313%20313-48.31%2047.54L512-663.15V-168h-66Z%22/%3E%3C/svg%3E')" aria-hidden="true"></span></button>
<button class="vc-send" aria-label="Gönder" disabled><span class="vc-icon " style="--icon:url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20height%3D%2224px%22%20viewBox%3D%220%20-960%20960%20960%22%20width%3D%2224px%22%20fill%3D%22%23000%22%3E%3Cpath%20d%3D%22M446-168v-495.15L216.31-433.46%20168-481l311-311%20313%20313-48.31%2047.54L512-663.15V-168h-66Z%22/%3E%3C/svg%3E')" aria-hidden="true"></span></button>
<button class="vc-send stop" aria-label="Durdur"></button>
</div>
</div></body></html>
