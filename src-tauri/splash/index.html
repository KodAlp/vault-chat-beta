<!doctype html>
<html lang="tr">
	<head>
		<meta charset="utf-8" />
		<title>Vault Chat</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #1a1a1a;
				--fg: #e8e8e8;
				--muted: #9a9a9a;
				--accent: #7c9cff;
				--error: #e5645a;
				--border: #3a3a3a;
			}
			@media (prefers-color-scheme: light) {
				:root {
					--bg: #ffffff;
					--fg: #1a1a1a;
					--muted: #666666;
					--border: #dddddd;
				}
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				display: flex;
				align-items: center;
				justify-content: center;
				background: var(--bg);
				color: var(--fg);
				font-family:
					system-ui,
					-apple-system,
					'Segoe UI',
					sans-serif;
			}
			.card {
				width: min(420px, 90vw);
				text-align: center;
			}
			.stage {
				width: 150px;
				margin: 0 auto 1.25rem;
				animation: enter 700ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
			}
			.logo {
				display: block;
				width: 150px;
				height: 150px;
				margin: 0 auto;
				transform-origin: bottom center;
				animation: bob 2.4s ease-in-out 700ms infinite alternate;
			}
			.shadow {
				width: 90px;
				height: 14px;
				margin: 0.4rem auto 0;
				border-radius: 50%;
				background: radial-gradient(
					ellipse closest-side,
					color-mix(in srgb, var(--fg) 30%, transparent),
					transparent 80%
				);
				animation:
					shadow-enter 700ms cubic-bezier(0.34, 1.56, 0.64, 1) both,
					shadow-pulse 2.4s ease-in-out 700ms infinite alternate;
			}
			/* .stopped freezes the bob/shadow-pulse loops (e.g. once an error is
			   shown) while keeping the one-shot entrance animation intact. */
			.stage.stopped .logo,
			.stage.stopped .shadow {
				animation-play-state: paused;
			}
			@keyframes enter {
				from {
					opacity: 0;
					transform: translateY(24px) scale(0.6);
				}
				70% {
					opacity: 1;
					transform: translateY(0) scale(1.06);
				}
				to {
					opacity: 1;
					transform: translateY(0) scale(1);
				}
			}
			@keyframes bob {
				from {
					transform: translateY(0) rotate(-2deg);
				}
				to {
					transform: translateY(-6px) rotate(2deg);
				}
			}
			@keyframes shadow-enter {
				from {
					opacity: 0;
				}
				to {
					opacity: 0.5;
				}
			}
			@keyframes shadow-pulse {
				from {
					transform: scaleX(1);
					opacity: 0.5;
				}
				to {
					transform: scaleX(0.85);
					opacity: 0.3;
				}
			}
			.dots {
				display: flex;
				justify-content: center;
				align-items: center;
				gap: 0.35rem;
				height: 6px;
				margin: 0 auto 1rem;
			}
			.dots span {
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: var(--accent);
				animation: dot-bounce 1.2s ease-in-out infinite;
			}
			.dots span:nth-child(2) {
				animation-delay: 0.15s;
			}
			.dots span:nth-child(3) {
				animation-delay: 0.3s;
			}
			@keyframes dot-bounce {
				0%,
				80%,
				100% {
					transform: translateY(0);
					opacity: 0.5;
				}
				40% {
					transform: translateY(-5px);
					opacity: 1;
				}
			}
			.status {
				color: var(--muted);
				font-size: 0.9rem;
				animation: fade-in 300ms ease-out 300ms both;
			}
			@keyframes fade-in {
				from {
					opacity: 0;
				}
				to {
					opacity: 1;
				}
			}
			.error {
				color: var(--error);
				font-size: 0.85rem;
				white-space: pre-wrap;
				text-align: left;
				background: color-mix(in srgb, var(--error) 10%, transparent);
				border-radius: 8px;
				padding: 0.75rem;
				margin-top: 1rem;
			}
			.node-panel {
				text-align: left;
			}
			.node-panel .desc {
				color: var(--muted);
				font-size: 0.85rem;
				margin: 0 0 1rem;
			}
			.log-area {
				background: color-mix(in srgb, var(--fg) 6%, transparent);
				border: 1px solid var(--border);
				border-radius: 8px;
				padding: 0.6rem 0.7rem;
				font-family:
					ui-monospace,
					SFMono-Regular,
					Consolas,
					monospace;
				font-size: 0.78rem;
				max-height: 160px;
				overflow-y: auto;
				white-space: pre-wrap;
				margin: 0 0 0.75rem;
			}
			.link-row {
				text-align: center;
				margin-top: 0.6rem;
				font-size: 0.85rem;
			}
			.link-row a {
				color: var(--accent);
				cursor: pointer;
				text-decoration: underline;
			}
			.hidden {
				display: none !important;
			}
			h1 {
				font-size: 1.1rem;
				margin: 0 0 1.5rem;
			}
			.field {
				display: flex;
				flex-direction: column;
				gap: 0.3rem;
				font-size: 0.85rem;
				margin-bottom: 1rem;
				text-align: left;
			}
			.path-row {
				display: flex;
				gap: 0.5rem;
			}
			input {
				flex: 1;
				background: var(--bg);
				color: var(--fg);
				border: 1px solid var(--border);
				border-radius: 6px;
				padding: 0.5rem 0.6rem;
				font-size: 0.9rem;
			}
			button {
				padding: 0.55rem 1.1rem;
				border-radius: 8px;
				border: 1px solid var(--border);
				background: transparent;
				color: var(--fg);
				cursor: pointer;
				font-size: 0.9rem;
			}
			button.primary {
				background: var(--accent);
				color: #08122e;
				border-color: var(--accent);
				font-weight: 600;
				width: 100%;
				margin-top: 0.5rem;
			}
			button:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}
			/* Fade+shrink the card just before navigating away, so the handoff
			   to the real app doesn't feel like an abrupt cut. Body keeps its
			   background so there's no flash underneath the fading card. */
			body.leaving .card {
				transition:
					opacity 250ms ease-out,
					transform 250ms ease-out;
				opacity: 0;
				transform: scale(0.96);
			}
			@media (prefers-reduced-motion: reduce) {
				.stage,
				.logo,
				.shadow,
				.dots span,
				.status {
					animation: none;
				}
				.stage {
					animation: reduced-fade 200ms ease-out both;
				}
				@keyframes reduced-fade {
					from {
						opacity: 0;
					}
					to {
						opacity: 1;
					}
				}
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="stage" id="stage">
				<img class="logo" src="logo.png" alt="" width="150" height="150" />
				<div class="shadow"></div>
			</div>
			<div id="loading">
				<div class="dots">
					<span></span>
					<span></span>
					<span></span>
				</div>
				<p class="status" id="loading-status">Başlatılıyor...</p>
			</div>

			<div id="setup" class="hidden">
				<h1>Kasa (vault) klasörünü seç</h1>
				<div class="field">
					<label for="vault-path">Klasör</label>
					<div class="path-row">
						<input id="vault-path" type="text" readonly placeholder="Henüz seçilmedi" />
						<button id="pick-btn" type="button">Seç…</button>
					</div>
				</div>
				<div class="field">
					<label for="vault-name">Vault adı</label>
					<input id="vault-name" type="text" placeholder="örn. First brain" />
				</div>
				<button id="confirm-btn" class="primary" type="button" disabled>Başlat</button>
			</div>

			<div id="node-panel" class="node-panel hidden">
				<h1 id="node-panel-title">Node.js 22 gerekli</h1>
				<p class="desc" id="node-panel-desc"></p>
				<div id="node-log" class="log-area hidden"></div>
				<button id="node-install-btn" class="primary" type="button">winget ile kur</button>
				<div class="link-row"><a id="node-download-link" href="#">İndirme sayfası</a></div>
			</div>

			<div id="error-box" class="error hidden"></div>
		</div>

		<script>
			const stageEl = document.getElementById('stage');
			const loadingEl = document.getElementById('loading');
			const loadingStatusEl = document.getElementById('loading-status');
			const setupEl = document.getElementById('setup');
			const errorEl = document.getElementById('error-box');
			const pathInput = document.getElementById('vault-path');
			const nameInput = document.getElementById('vault-name');
			const pickBtn = document.getElementById('pick-btn');
			const confirmBtn = document.getElementById('confirm-btn');
			const nodePanelEl = document.getElementById('node-panel');
			const nodePanelTitleEl = document.getElementById('node-panel-title');
			const nodePanelDescEl = document.getElementById('node-panel-desc');
			const nodeLogEl = document.getElementById('node-log');
			const nodeInstallBtn = document.getElementById('node-install-btn');
			const nodeDownloadLink = document.getElementById('node-download-link');

			// The Node.js winget package id this splash page is ever allowed to
			// ask for — must be one of winget.rs's allowlisted ids (it is: see
			// winget.rs's EXTRA_ALLOWLISTED_PACKAGES). Never derived from
			// anything the backend hands back, so there's no path from a
			// NodeProblem payload to an arbitrary winget id reaching invoke().
			const NODE_WINGET_ID = 'OpenJS.NodeJS.22';
			const NODE_DOWNLOAD_URL = 'https://nodejs.org/en/download';

			const delay = (ms) => new Promise((r) => setTimeout(r, ms));

			// Fades/shrinks the card out, then swaps the page. Used for every
			// hand-off to the real app so the transition feels intentional
			// rather than an instant blank-then-repaint.
			function navigate(url) {
				document.body.classList.add('leaving');
				setTimeout(() => {
					window.location.href = url;
				}, 250);
			}

			function showError(message) {
				loadingEl.classList.add('hidden');
				setupEl.classList.add('hidden');
				nodePanelEl.classList.add('hidden');
				stageEl.classList.add('stopped');
				errorEl.textContent = message;
				errorEl.classList.remove('hidden');
			}

			// Shown instead of the generic error box when check_and_start /
			// save_vault_config_and_start report a nodeProblem — a missing or
			// wrong-major Node install, which (unlike most other startup
			// failures) this page can offer a one-click fix for via winget.
			async function showNodeProblem(problem) {
				loadingEl.classList.add('hidden');
				setupEl.classList.add('hidden');
				errorEl.classList.add('hidden');
				stageEl.classList.add('stopped');
				nodeLogEl.classList.add('hidden');
				nodeLogEl.textContent = '';

				nodePanelTitleEl.textContent =
					problem.kind === 'wrong_version'
						? `Node.js sürümü uyumsuz: bulunan ${problem.found ?? 'bilinmeyen sürüm'}, gereken ${problem.required}`
						: 'Node.js 22 gerekli';
				nodePanelDescEl.textContent =
					'Vault Chat masaüstü sürümünün yerel sunucusu Node.js üzerinde çalışır; farklı bir ana sürüm, ' +
					'veritabanı modülünün (better-sqlite3) yüklenmesini bozar. Devam etmek için Node.js ' +
					`${problem.required} sürümü gerekiyor.` +
					// winget's Node MSI installs into the same Program Files\nodejs
					// folder, so on a machine that already has another major this
					// replaces it for every other tool that uses Node too.
					(problem.kind === 'wrong_version'
						? ' Uyarı: kurulum, bilgisayardaki mevcut Node.js sürümünün yerini alabilir; ' +
							'başka projelerde farklı bir sürüm kullanıyorsanız nvm gibi bir sürüm yöneticisi tercih edin.'
						: '');

				nodeInstallBtn.disabled = false;
				nodePanelEl.classList.remove('hidden');

				// Only offer the one-click install when winget itself is
				// reachable — otherwise hide it and leave just the manual
				// download link, per this stage's spec.
				let wingetOk = false;
				try {
					wingetOk = await window.__TAURI__.core.invoke('winget_available');
				} catch (err) {
					wingetOk = false;
				}
				nodeInstallBtn.classList.toggle('hidden', !wingetOk);
			}

			// Belt-and-suspenders: this splash page has no devtools access on a
			// packaged build, so ANY uncaught error (a typo, an API-shape
			// mismatch after a Tauri upgrade, whatever) must become visible
			// text in the window itself rather than a silent blank screen —
			// that's the whole reason this page exists instead of just letting
			// the SvelteKit app render its own loading state.
			window.addEventListener('error', (e) => showError(`Beklenmeyen hata: ${e.message}`));
			window.addEventListener('unhandledrejection', (e) =>
				showError(`Beklenmeyen hata: ${e.reason}`)
			);

			function updateConfirmEnabled() {
				confirmBtn.disabled = !pathInput.value.trim() || !nameInput.value.trim();
			}

			// The window starts hidden (tauri.conf.json's "visible": false) so
			// SvelteKit's dev-mode CSR-boot gap (blank/white until its JS
			// mounts) never flashes on screen — see +layout.svelte's own
			// show() call for that path. This splash page's own content is
			// instant (plain inline HTML/CSS, no bundle to wait for), so it
			// shows the window itself, first thing, before even checking the
			// Tauri bridge below.
			if (window.__TAURI__ && window.__TAURI__.window) {
				window.__TAURI__.window.getCurrentWindow().show();
			}

			async function main() {
				if (!window.__TAURI__ || !window.__TAURI__.core) {
					showError(
						'Tauri köprüsü yüklenemedi (window.__TAURI__ tanımsız). ' +
							`window anahtarları: ${Object.keys(window).slice(0, 30).join(', ')}`
					);
					return;
				}
				try {
					const { invoke } = window.__TAURI__.core;
					// Hold the splash on screen for at least ~900ms so the entrance
					// animation gets to play out even when check_and_start resolves
					// almost instantly (fast machines / warm cache).
					const [result] = await Promise.all([invoke('check_and_start'), delay(900)]);
					if (result.nodeProblem) {
						await showNodeProblem(result.nodeProblem);
					} else if (result.needsConfig) {
						loadingEl.classList.add('hidden');
						setupEl.classList.remove('hidden');
					} else {
						navigate(result.url);
					}
				} catch (err) {
					showError(String(err));
				}
			}

			pickBtn.addEventListener('click', async () => {
				const { open } = window.__TAURI__.dialog;
				const picked = await open({ directory: true, multiple: false });
				if (picked) {
					pathInput.value = picked;
					if (!nameInput.value) {
						const parts = picked.split(/[/\\]/).filter(Boolean);
						nameInput.value = parts[parts.length - 1] ?? '';
					}
				}
				updateConfirmEnabled();
			});

			nameInput.addEventListener('input', updateConfirmEnabled);

			confirmBtn.addEventListener('click', async () => {
				const { invoke } = window.__TAURI__.core;
				confirmBtn.disabled = true;
				setupEl.classList.add('hidden');
				loadingEl.classList.remove('hidden');
				loadingStatusEl.textContent = 'Sunucu başlatılıyor...';
				try {
					const result = await invoke('save_vault_config_and_start', {
						vaultPath: pathInput.value,
						vaultName: nameInput.value
					});
					if (result.nodeProblem) {
						await showNodeProblem(result.nodeProblem);
					} else {
						navigate(result.url);
					}
				} catch (err) {
					showError(String(err));
				}
			});

			nodeDownloadLink.addEventListener('click', async (e) => {
				e.preventDefault();
				try {
					await window.__TAURI__.core.invoke('plugin:opener|open_url', { url: NODE_DOWNLOAD_URL });
				} catch (err) {
					showError(String(err));
				}
			});

			nodeInstallBtn.addEventListener('click', async () => {
				const { invoke } = window.__TAURI__.core;
				nodeInstallBtn.disabled = true;
				nodeLogEl.textContent = '';
				nodeLogEl.classList.remove('hidden');

				const appendLine = (line) => {
					nodeLogEl.textContent += line + '\n';
					nodeLogEl.scrollTop = nodeLogEl.scrollHeight;
				};

				// Live progress while winget runs — see winget.rs's
				// `winget-progress` event (payload: { id, line }, already
				// cleaned of spinner/progress-bar control characters on the
				// Rust side). Filtered by id defensively, even though only one
				// install can be in flight at a time (winget.rs's single-flight
				// guard), in case a stray event from an unrelated id ever
				// arrives here.
				let unlisten = null;
				try {
					unlisten = await window.__TAURI__.event.listen('winget-progress', (event) => {
						if (event.payload && event.payload.id === NODE_WINGET_ID) {
							appendLine(event.payload.line);
						}
					});
				} catch (err) {
					// Event listening unavailable for some reason — installation
					// still proceeds; the log area just stays quiet until done.
				}

				let installedOk = false;
				try {
					await invoke('winget_install', { id: NODE_WINGET_ID });
					installedOk = true;
				} catch (err) {
					appendLine(`Hata: ${String(err)}`);
				}

				if (unlisten) unlisten();

				if (installedOk) {
					appendLine('Kurulum tamamlandı, Node.js yeniden kontrol ediliyor...');
					try {
						// resolve_node_binary() (lib.rs) checks the fixed
						// %ProgramFiles%\nodejs\node.exe location FIRST — exactly
						// where Node's official Windows installer just placed it
						// — so this finds the fresh install without needing to
						// relaunch the app for a refreshed PATH.
						const status = await invoke('recheck_node');
						if (status.ok) {
							stageEl.classList.remove('stopped');
							nodePanelEl.classList.add('hidden');
							loadingEl.classList.remove('hidden');
							loadingStatusEl.textContent = 'Sunucu başlatılıyor...';
							await main();
							return;
						}
						appendLine('Kurulumdan sonra Node.js hâlâ doğrulanamadı.');
						if (status.nodeProblem) {
							await showNodeProblem(status.nodeProblem);
						}
					} catch (err) {
						appendLine(`Hata: ${String(err)}`);
					}
				}

				nodeInstallBtn.disabled = false;
			});

			main();
		</script>
	</body>
</html>
