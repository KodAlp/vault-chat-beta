<!doctype html>
<html lang="tr">
	<head>
		<meta charset="utf-8" />
		<title>Vault Chat</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #1a1a1a;
				--fg: #e8e8e8;
				--muted: #9a9a9a;
				--accent: #7c9cff;
				--error: #e5645a;
				--border: #3a3a3a;
			}
			@media (prefers-color-scheme: light) {
				:root {
					--bg: #ffffff;
					--fg: #1a1a1a;
					--muted: #666666;
					--border: #dddddd;
				}
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				display: flex;
				align-items: center;
				justify-content: center;
				background: var(--bg);
				color: var(--fg);
				font-family:
					system-ui,
					-apple-system,
					'Segoe UI',
					sans-serif;
			}
			.card {
				width: min(420px, 90vw);
				text-align: center;
			}
			.spinner {
				width: 2rem;
				height: 2rem;
				margin: 0 auto 1rem;
				border: 3px solid var(--border);
				border-top-color: var(--accent);
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
			.status {
				color: var(--muted);
				font-size: 0.9rem;
			}
			.error {
				color: var(--error);
				font-size: 0.85rem;
				white-space: pre-wrap;
				text-align: left;
				background: color-mix(in srgb, var(--error) 10%, transparent);
				border-radius: 8px;
				padding: 0.75rem;
				margin-top: 1rem;
			}
			.hidden {
				display: none !important;
			}
			h1 {
				font-size: 1.1rem;
				margin: 0 0 1.5rem;
			}
			.field {
				display: flex;
				flex-direction: column;
				gap: 0.3rem;
				font-size: 0.85rem;
				margin-bottom: 1rem;
				text-align: left;
			}
			.path-row {
				display: flex;
				gap: 0.5rem;
			}
			input {
				flex: 1;
				background: var(--bg);
				color: var(--fg);
				border: 1px solid var(--border);
				border-radius: 6px;
				padding: 0.5rem 0.6rem;
				font-size: 0.9rem;
			}
			button {
				padding: 0.55rem 1.1rem;
				border-radius: 8px;
				border: 1px solid var(--border);
				background: transparent;
				color: var(--fg);
				cursor: pointer;
				font-size: 0.9rem;
			}
			button.primary {
				background: var(--accent);
				color: #08122e;
				border-color: var(--accent);
				font-weight: 600;
				width: 100%;
				margin-top: 0.5rem;
			}
			button:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div id="loading">
				<div class="spinner"></div>
				<p class="status" id="loading-status">Başlatılıyor...</p>
			</div>

			<div id="setup" class="hidden">
				<h1>Kasa (vault) klasörünü seç</h1>
				<div class="field">
					<label for="vault-path">Klasör</label>
					<div class="path-row">
						<input id="vault-path" type="text" readonly placeholder="Henüz seçilmedi" />
						<button id="pick-btn" type="button">Seç…</button>
					</div>
				</div>
				<div class="field">
					<label for="vault-name">Obsidian'da görünen vault adı</label>
					<input id="vault-name" type="text" placeholder="örn. First brain" />
				</div>
				<button id="confirm-btn" class="primary" type="button" disabled>Başlat</button>
			</div>

			<div id="error-box" class="error hidden"></div>
		</div>

		<script>
			const loadingEl = document.getElementById('loading');
			const loadingStatusEl = document.getElementById('loading-status');
			const setupEl = document.getElementById('setup');
			const errorEl = document.getElementById('error-box');
			const pathInput = document.getElementById('vault-path');
			const nameInput = document.getElementById('vault-name');
			const pickBtn = document.getElementById('pick-btn');
			const confirmBtn = document.getElementById('confirm-btn');

			function showError(message) {
				loadingEl.classList.add('hidden');
				errorEl.textContent = message;
				errorEl.classList.remove('hidden');
			}

			// Belt-and-suspenders: this splash page has no devtools access on a
			// packaged build, so ANY uncaught error (a typo, an API-shape
			// mismatch after a Tauri upgrade, whatever) must become visible
			// text in the window itself rather than a silent blank screen —
			// that's the whole reason this page exists instead of just letting
			// the SvelteKit app render its own loading state.
			window.addEventListener('error', (e) => showError(`Beklenmeyen hata: ${e.message}`));
			window.addEventListener('unhandledrejection', (e) =>
				showError(`Beklenmeyen hata: ${e.reason}`)
			);

			function updateConfirmEnabled() {
				confirmBtn.disabled = !pathInput.value.trim() || !nameInput.value.trim();
			}

			async function main() {
				if (!window.__TAURI__ || !window.__TAURI__.core) {
					showError(
						'Tauri köprüsü yüklenemedi (window.__TAURI__ tanımsız). ' +
							`window anahtarları: ${Object.keys(window).slice(0, 30).join(', ')}`
					);
					return;
				}
				try {
					const { invoke } = window.__TAURI__.core;
					const result = await invoke('check_and_start');
					if (result.needsConfig) {
						loadingEl.classList.add('hidden');
						setupEl.classList.remove('hidden');
					} else {
						window.location.href = result.url;
					}
				} catch (err) {
					showError(String(err));
				}
			}

			pickBtn.addEventListener('click', async () => {
				const { open } = window.__TAURI__.dialog;
				const picked = await open({ directory: true, multiple: false });
				if (picked) {
					pathInput.value = picked;
					if (!nameInput.value) {
						const parts = picked.split(/[/\\]/).filter(Boolean);
						nameInput.value = parts[parts.length - 1] ?? '';
					}
				}
				updateConfirmEnabled();
			});

			nameInput.addEventListener('input', updateConfirmEnabled);

			confirmBtn.addEventListener('click', async () => {
				const { invoke } = window.__TAURI__.core;
				confirmBtn.disabled = true;
				setupEl.classList.add('hidden');
				loadingEl.classList.remove('hidden');
				loadingStatusEl.textContent = 'Sunucu başlatılıyor...';
				try {
					const url = await invoke('save_vault_config_and_start', {
						vaultPath: pathInput.value,
						vaultName: nameInput.value
					});
					window.location.href = url;
				} catch (err) {
					showError(String(err));
				}
			});

			main();
		</script>
	</body>
</html>
