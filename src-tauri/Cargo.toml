[package]
name = "app"
version = "0.3.0"
description = "Vault Chat — local-first RAG study assistant (desktop shell)"
authors = ["KodAlp"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# Opens model-produced links in the OS's default browser instead of Tauri's
# own webview navigating away from the app with no way back (İdeas.txt bug:
# "the model redirects you inside the app, not the browser, and you can't
# get back without relaunching"). See src/lib/openExternalLink.ts and
# markdown.ts's link_open override for the frontend half.
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["time"] }
# CSPRNG for the key's initial 32 bytes — a well-audited, minimal crate
# beats hand-written FFI to BCryptGenRandom/RtlGenRandom for something this
# security-sensitive (a subtly wrong ABI call here would be silent, not a
# compile error).
getrandom = "0.2"

# Windows-only: Job Objects (kill-on-close process trees) and DPAPI.
[target.'cfg(windows)'.dependencies]
win32job = "2"
# DPAPI (CryptProtectData/CryptUnprotectData) for at-rest encryption of the
# sidecar's secrets-key blob — see spawn_sidecar()'s
# dpapi_get_or_create_secrets_key().
# Pinned to align with the windows-core version Tauri's own dependency tree
# already uses (tao/wry pull windows-core 0.61.x) — a mismatched version
# here creates two incompatible copies of types like HLOCAL, which fails to
# compile even though both are nominally "the windows crate".
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

# POSIX: setsid/prctl/kill for process-group cleanup (see src/platform.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# L2 — OS-level storage for the secrets-encryption key (see src/secrets_key.rs).
# keyring 3.x, feature names verified against the crate's own Cargo.toml:
#   apple-native        -> macOS Keychain (security-framework)
#   sync-secret-service -> Linux Secret Service over D-Bus (dbus-secret-service)
#   crypto-rust         -> pure-Rust session encryption for the Secret Service
#                          transport (no OpenSSL dependency)
# Deliberately NOT linux-native (kernel keyutils): it does not survive a reboot.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
