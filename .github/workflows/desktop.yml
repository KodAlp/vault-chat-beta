name: desktop

# Triggers: pushes to main and `ci`, version tags (v*), pull requests, and by hand from the Actions tab.
# While the repository is PRIVATE, only `ci` pushes and manual runs build: main, tag and PR runs
# are skipped by the job's `if` (no runner starts, no Actions minutes used). Once the repo is
# public they run automatically; no change to this file is needed.
# Docs-only changes (*.md, docs/) do not trigger a build; tag pushes always do.
on:
  workflow_dispatch:
  push:
    branches: [main, ci]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older, still-running build.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.label }})
    if: >-
      github.event.repository.private == false
      || github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/ci'
    runs-on: ${{ matrix.os }}
    # Windows ARM64 is expected to fail for now (see the matrix); it must not turn main/PRs red.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64 }
          - { os: ubuntu-22.04, label: linux-x64 }
          - { os: macos-15, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x64 }
          # Native Windows ARM64. Expected to FAIL until sqlite-vec ships a windows-arm64 build
          # (0.1.9 has none and indexer/db.ts + retrieve.ts load it unconditionally); the x64 installer already
          # runs on Windows 11 ARM under emulation.
          - { os: windows-11-arm, label: windows-arm64, experimental: true }
    defaults:
      run:
        shell: bash
    env:
      # AppImage tooling must not need FUSE on hosted runners.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
        with:
          components: clippy

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libdbus-1-dev

      - run: npm ci
      - run: npx svelte-kit sync
      - run: npm test
      - run: npx svelte-check

      # Only the light, pure-Python deps the ingest tests import (trafilatura -> lxml,
      # pypdf, py-asciimath); markitdown[all] and yt-dlp are not needed by the tests.
      # Test files written for pytest (they `import pytest`) run under pytest; the rest are scripts.
      - name: Python ingest tests
        run: |
          python -m pip install trafilatura==2.2.0 py-asciimath==0.3.0 pypdf==6.14.2 pytest==9.1.1
          cd ingest
          for t in *_test.py; do
            echo "== $t"
            if grep -q '^import pytest' "$t"; then python -m pytest -q "$t"; else python "$t"; fi
          done

      # build.rs / tauri resources glob needs ../dist-server/**/* to exist before cargo runs.
      - name: Rust checks
        run: |
          mkdir -p dist-server
          touch dist-server/placeholder.txt
          cd src-tauri
          cargo clippy --all-targets -- -D warnings
          cargo test
          cd ..
          rm -rf dist-server

      - name: Bundle
        if: runner.os != 'macOS'
        run: npx tauri build

      # macOS: Tauri's bundle_dmg.sh drives Finder via AppleScript to lay out the dmg window, which
      # intermittently times out / hits "hdiutil: Resource busy" on headless GitHub runners (macos-x64
      # passed and then failed on the same code). Build only the .app with Tauri, then make a plain
      # compressed dmg with hdiutil (no Finder scripting), retrying a busy hdiutil.
      - name: Bundle (macOS app + dmg)
        if: runner.os == 'macOS'
        run: |
          npx tauri build --bundles app
          APP_DIR=src-tauri/target/release/bundle/macos
          DMG_DIR=src-tauri/target/release/bundle/dmg
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ARCH=$(uname -m | sed 's/x86_64/x64/')
          mkdir -p "$DMG_DIR"
          DMG="$DMG_DIR/vault-chat_${VERSION}_${ARCH}.dmg"
          # Staging folder = what the user sees when the dmg opens: the app + a drag-to-install link.
          STAGE=$(mktemp -d)
          cp -R "$APP_DIR/vault-chat.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          for attempt in 1 2 3; do
            if hdiutil create -volname vault-chat -srcfolder "$STAGE" -ov -format UDZO "$DMG"; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "hdiutil failed (attempt $attempt), retrying in 10s"; sleep 10
          done
          ls -la "$DMG_DIR"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vault-chat-${{ matrix.label }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7
