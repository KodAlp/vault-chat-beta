name: desktop

on:
  workflow_dispatch:
  push:
    branches: [linux-destegi, macos-destegi, main]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64 }
          - { os: ubuntu-22.04, label: linux-x64 }
          - { os: macos-15, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x64 }
    defaults:
      run:
        shell: bash
    env:
      # AppImage tooling must not need FUSE on hosted runners.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libdbus-1-dev

      - run: npm ci
      - run: npx svelte-kit sync
      - run: npm test
      - run: npx svelte-check

      # Only the light, pure-Python deps the ingest tests import (trafilatura -> lxml,
      # pypdf, py-asciimath); markitdown[all] and yt-dlp are not needed by the tests.
      - name: Python ingest tests
        run: |
          python -m pip install trafilatura==2.2.0 py-asciimath==0.3.0 pypdf==6.14.2
          cd ingest
          for t in *_test.py; do echo "== $t"; python "$t"; done

      # build.rs / tauri resources glob needs ../dist-server/**/* to exist before cargo runs.
      - name: Rust checks
        run: |
          mkdir -p dist-server
          touch dist-server/placeholder.txt
          cd src-tauri
          cargo clippy --all-targets -- -D warnings
          cargo test
          cd ..
          rm -rf dist-server

      - name: Bundle
        if: runner.os != 'macOS'
        run: npx tauri build

      # macOS: Tauri's bundle_dmg.sh drives Finder via AppleScript to lay out the dmg window, which
      # intermittently times out / hits "hdiutil: Resource busy" on headless GitHub runners (macos-x64
      # passed and then failed on the same code). Build only the .app with Tauri, then make a plain
      # compressed dmg with hdiutil (no Finder scripting), retrying a busy hdiutil.
      - name: Bundle (macOS app + dmg)
        if: runner.os == 'macOS'
        run: |
          npx tauri build --bundles app
          APP_DIR=src-tauri/target/release/bundle/macos
          DMG_DIR=src-tauri/target/release/bundle/dmg
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ARCH=$(uname -m | sed 's/x86_64/x64/')
          mkdir -p "$DMG_DIR"
          DMG="$DMG_DIR/vault-chat_${VERSION}_${ARCH}.dmg"
          # Staging folder = what the user sees when the dmg opens: the app + a drag-to-install link.
          STAGE=$(mktemp -d)
          cp -R "$APP_DIR/vault-chat.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          for attempt in 1 2 3; do
            if hdiutil create -volname vault-chat -srcfolder "$STAGE" -ov -format UDZO "$DMG"; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "hdiutil failed (attempt $attempt), retrying in 10s"; sleep 10
          done
          ls -la "$DMG_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: vault-chat-${{ matrix.label }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7
