name: security

# Runs on pushes to main and `ci`, on pull requests, weekly, and by hand from the Actions tab.
# Same checks locally: node scripts/security-audit.mjs
on:
  workflow_dispatch:
  push:
    branches: [main, ci]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: npm audit / cargo audit / gitleaks
    runs-on: ubuntu-latest
    env:
      CI: "1"
      GITLEAKS_VERSION: "8.28.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit

      - name: Install gitleaks (pinned release, plain CLI)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tgz
          gitleaks version

      - run: node scripts/security-audit.mjs
