<!doctype html>
<html lang="tr">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- No-JS fallback for the gap between this raw shell loading and
		     Svelte actually mounting (+layout.svelte's own $effect sets the
		     real data-theme, but that needs JS to have run first) — matches
		     tokens.css's --bg-canvas so that gap reads as "still loading" in
		     the right tone instead of a stark white flash, light or dark.
		     Scoped to :not([data-theme]) because this rule is unlayered and
		     app.css's real body background lives in @layer base — unscoped,
		     it beat the chosen theme for good (black ground on a light theme
		     wherever a page doesn't paint its own background). -->
		<style>
			html:not([data-theme]) body {
				background: #fcfbf8;
			}
			@media (prefers-color-scheme: dark) {
				html:not([data-theme]) body {
					background: #000000;
				}
			}
			/* Set by static/theme-boot.js before first paint: each theme's
			   --bg-canvas on <html> (not body, so app.css's layered body rule
			   still wins once loaded) — a reload shows the chosen theme's tone
			   instead of a black or white flash. Keep in sync with tokens.css. */
			html[data-theme="light"] { background: #fcfbf8; }
			html[data-theme="dark"] { background: #000000; }
			html[data-theme="cream"] { background: #f6efe0; }
			html[data-theme="sand"] { background: #f1e6cf; }
			html[data-theme="forest"] { background: #0f1d1c; }
		</style>
		<script src="%sveltekit.assets%/theme-boot.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!--
		THESIS: A private local RAG study tool reads as a dark observatory
		instrument, not another indigo/system-ui SaaS chat template.
		OWN-WORLD: near-black green-tinted ground, one living green accent,
		hairline depth (no shadows), Figtree/Newsreader.
		STORY: the visitor's own vault made interactive; every answer is
		source-grounded, never invented; they ask, verify citations, generate
		study material from what's real.
		FIRST VIEWPORT: chat surface — source tree left, transcript with
		citation chips center, icon rail right; accent marks only the active
		state.
		FORM: brief-pinned (DESIGN.md), not rolled — a fully committed visual
		world was handed in; this build is implementation, not invention.
		FINISH: unreviewed and undocumented is unfinished; this build ends
		with the finish review, the verdict, and DESIGN.md
		-->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
